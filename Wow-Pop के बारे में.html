<style>
    span:hover {color: red;}
    .container {width: 100%;
               max-height: 500px;
               background-image: url("Untitled%20343.png");
    }
    .gif-slideshow {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 300px;
      background: #111;
      z-index: 1000;
      overflow: hidden;
    }

    /* GIF fills the slideshow */
    .gif-display {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .gif-display img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Optional dark overlay for better button visibility */
    .gif-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.15),
        transparent 35%,
        transparent 60%,
        rgba(0, 0, 0, 0.30)
      );
      pointer-events: none;
    }

    /* Controls positioned over the GIF */
    .gif-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
      z-index: 2;
    }

    /* Semi-transparent overlay buttons */
    .gif-controls button {
      background: rgba(0, 0, 0, 0.65);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 30px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: background 0.2s, transform 0.2s;
    }

    .gif-controls button:hover {
      background: rgba(0, 0, 0, 0.9);
      transform: scale(1.05);
    }

    .gif-controls button:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    /* Slide number shown over the GIF */
    #slideCounter {
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 13px;
    }

    /* Top-right close button */
    .close-button {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      width: 40px;
      height: 40px;
      padding: 0 !important;
      font-size: 23px !important;
      border-radius: 50% !important;
    }

    /* Small-screen layout */
    @media (max-width: 600px) {
      body {
        padding-bottom: 230px;
      }

<section
    class="gif-slideshow"
    id="gifSlideshow"
    aria-label="Animated GIF slideshow"
  >

    <!-- GIF image -->
    <div class="gif-display">
      <img
        id="gifImage"
        src="Wow-Pop72.gif"
        alt="Slideshow image"
        onclick="location.href=''"
      >
    </div>

    <!-- Visual overlay -->
    <div class="gif-overlay"></div>

    <!-- Hide button in the top-right corner -->
    <button
      class="gif-controls close-button"
      id="hideButton"
      onclick="toggleSlideshow()"
      aria-label="Hide slideshow"
      title="Hide slideshow"
      style="left:auto; right:12px; bottom:auto;"
    >
      &times;
    </button>

    <!-- Control buttons over the GIF -->
    <div class="gif-controls">

      <button
        onclick="previousSlide()"
        aria-label="Previous GIF"
        title="Previous GIF"
      >
        &#10094; Prev
      </button>

      <button
        onclick="togglePlay()"
        id="playButton"
        aria-label="Pause slideshow"
      >
        &#10074;&#10074; Pause
      </button>

      <button
        onclick="nextSlide()"
        aria-label="Next GIF"
        title="Next GIF"
      >
        Next &#10095;
      </button>

      <span id="slideCounter" aria-live="off">1 / 4</span>

    </div>
  </section>

  <!-- Reopen slideshow button -->
  <button
    id="showButton"
    onclick="toggleSlideshow()"
    style="
      display:none;
      position:fixed;
      bottom:15px;
      right:15px;
      z-index:1001;
      padding:12px 18px;
      background:#222;
      color:white;
      border:1px solid #777;
      border-radius:25px;
      cursor:pointer;
    "
  >
    Show GIFs
  </button>
<script>
    // Replace these paths with your own GIF files.
    const gifs = [
      "Wow-Pop2.gif",
      "Wow-Pop3.gif",
      "Wow-Pop4.gif",
      "Wow-Pop5.gif",
      "Wow-Pop6.gif",
      "Wow-Pop7.gif",
      "Wow-Pop72.gif",
      "Wow-Pop9.gif",
      "Wow-Pop10.gif",
      "Wow-Pop4441.gif"
    ];

    const slideshow = document.getElementById("gifSlideshow");
    const gifImage = document.getElementById("gifImage");
    const playButton = document.getElementById("playButton");
    const counter = document.getElementById("slideCounter");
    const showButton = document.getElementById("showButton");

    let currentIndex = 0;
    let playing = true;
    let timer = null;

    // Display a selected GIF.
    function showSlide(index) {
      currentIndex = (index + gifs.length) % gifs.length;
      gifImage.src = gifs[currentIndex];
      counter.textContent =
        `${currentIndex + 1} / ${gifs.length}`;
    }

    // Move to the next GIF.
    function nextSlide() {
      showSlide(currentIndex + 1);
      startTimer();
    }

    // Move to the previous GIF.
    function previousSlide() {
      showSlide(currentIndex - 1);
      startTimer();
    }

    // Start or restart automatic playback.
    function startTimer() {
      clearInterval(timer);
      timer = null;

      if (playing && !slideshow.hidden) {
        timer = setInterval(() => {
          showSlide(currentIndex + 1);
        }, 4000);
      }
    }

    // Toggle automatic playback.
    function togglePlay() {
      playing = !playing;

      playButton.innerHTML = playing
        ? "&#10074;&#10074; Pause"
        : "&#9654; Play";

      playButton.setAttribute(
        "aria-label",
        playing ? "Pause slideshow" : "Play slideshow"
      );

      startTimer();
    }

    // Hide or reopen the entire slideshow.
    function toggleSlideshow() {
      const isVisible = slideshow.style.display !== "none";

      if (isVisible) {
        slideshow.style.display = "none";
        showButton.style.display = "block";
        document.body.style.paddingBottom = "0";
        clearInterval(timer);
        timer = null;
      } else {
        slideshow.style.display = "block";
        showButton.style.display = "none";

        document.body.style.paddingBottom =
          window.innerWidth <= 600 ? "230px" : "320px";

        startTimer();
      }
    }

    // Initialize slideshow.
    showSlide(0);
    startTimer();
  </script>
